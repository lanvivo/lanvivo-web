<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F0E4;--surface:#FFFFFF;--ink:#1A1C2A;--muted:#6A7090;
  --rule:#DDD8CC;--gold:#B8821E;--gold-l:#C8942A;--deep:#1A2A5E;
  /* Results palette — identical tokens to the portal so both surfaces match */
  --r-ink:#1A1C2A; --r-body:#6B6C7E; --r-cap:#6B6C7E;
  --r-rule:#E8E0CC; --r-rule-l:#F0EAE0; --r-panel:#F7F4EE;
  --r-pos:#2E7D52; --r-warn:#8A5E0A; --r-neg:#C62828;
}
body.dark{
  --bg:#0A0E1A;--surface:#101624;--ink:#F5F0E4;--muted:#6A7090;
  --rule:rgba(26,42,94,0.7);--gold:#C8942A;
  --r-ink:#F5F0E4; --r-body:#B4BCD0; --r-cap:#9AA2B8;
  --r-rule:rgba(26,42,94,0.7); --r-rule-l:rgba(26,42,94,0.45);
  --r-panel:rgba(255,255,255,0.04);
  --r-pos:#4FA97B; --r-warn:#D0A03F; --r-neg:#E86A6A;
}
body{font-family:'DM Sans',sans-serif;font-weight:300;background:var(--bg);color:var(--ink);min-height:100vh}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── auth gate ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0A0E1A;padding:24px;z-index:50}
#gate.hide{display:none}
.gate-box{width:100%;max-width:380px}
.gate-mark{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px}
.gate-coin{width:34px;height:34px;border:2px solid var(--gold-l);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold-l);font-weight:600}
.gate-word{font-family:'Cormorant Garamond',serif;font-size:20px;color:#fff;letter-spacing:.5px}
.gate-card{background:#fff;border-radius:4px;padding:28px}
.gate-card h1{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;color:#1A1C2A;margin-bottom:4px}
.gate-card p{font-size:12.5px;color:#6A7090;margin-bottom:20px}
.gate-f{margin-bottom:13px}
.gate-f label{display:block;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#4A5070;margin-bottom:6px}
.gate-f input{width:100%;background:#F5F0E4;border:1px solid #DDD8CC;border-radius:3px;padding:11px 13px;font-family:'DM Sans',sans-serif;font-size:14px;color:#1A1C2A;outline:none}
.gate-f input:focus{border-color:var(--gold)}
.gate-btn{width:100%;background:var(--gold-l);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:12px;border:none;border-radius:3px;cursor:pointer;margin-top:6px}
.gate-btn:hover{opacity:.9}
.gate-btn:disabled{opacity:.5;cursor:not-allowed}
.gate-div{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:#9B9CAD;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.gate-div::before,.gate-div::after{content:'';flex:1;height:1px;background:#DDD8CC}
.gate-google{width:100%;background:#fff;color:#3c4043;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;padding:11px;border:1px solid #dadce0;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gate-google:hover{background:#f8f9fa;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.gate-google:disabled{opacity:.5;cursor:not-allowed}
.gate-err{background:#FDECEA;color:#8B2020;padding:9px 13px;border-radius:3px;font-size:12.5px;margin-bottom:13px;display:none}

/* ── shell ── */
.shell{display:none;padding:26px 22px 60px}
.shell.on{display:block}
/* ── Admin analytics ──────────────────────────────────────────────────────── */
.adm-wrap{max-width:1080px;margin:0 auto}
.adm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.adm-head h2{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:var(--ink);margin-bottom:4px}
.adm-head p{font-size:12px;color:var(--r-cap)}
.adm-sec{margin-bottom:26px}
.adm-sec-h{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--r-cap);margin-bottom:10px}
.adm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.adm-tile{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:15px 16px}
.adm-tile-k{font-size:9.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--r-cap);margin-bottom:6px}
.adm-tile-v{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;line-height:1;color:var(--r-ink)}
.adm-tile-s{font-size:10.5px;color:var(--r-cap);margin-top:4px}
.adm-tile.pos .adm-tile-v{color:var(--r-pos)}
.adm-tile.warn .adm-tile-v{color:var(--r-warn)}
.adm-tile.neg .adm-tile-v{color:var(--r-neg)}
.adm-card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.adm-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-bar-row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;padding:5px 0;font-size:11.5px}
.adm-bar-lbl{color:var(--r-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-bar-track{height:7px;background:var(--r-rule);border-radius:4px;overflow:hidden}
.adm-bar-fill{height:100%;border-radius:4px;background:var(--r-pos)}
.adm-bar-n{text-align:right;font-weight:600;color:var(--r-ink);font-size:11.5px}
.adm-spark{display:flex;align-items:flex-end;gap:2px;height:56px;margin-top:6px}
.adm-spark-b{flex:1;min-width:3px;background:var(--r-pos);border-radius:2px 2px 0 0;opacity:.85}
.adm-spark-x{display:flex;justify-content:space-between;font-size:9.5px;color:var(--r-cap);margin-top:5px}
.adm-table{width:100%;border-collapse:collapse;font-size:11.5px}
.adm-table thead th{text-align:left;font-size:9px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--r-cap);padding:7px 8px;border-bottom:1.5px solid var(--rule)}
.adm-table tbody td{padding:7px 8px;border-bottom:1px solid var(--r-rule-l);color:var(--r-body)}
.adm-table tbody td:first-child{color:var(--r-ink);font-weight:500}
.adm-table tbody tr:hover td{background:var(--r-panel)}
.adm-pill{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.4px;padding:2px 7px;border-radius:10px;text-transform:uppercase}
.adm-pill.ok{background:rgba(46,125,82,.12);color:var(--r-pos)}
.adm-pill.no{background:rgba(198,40,40,.12);color:var(--r-neg)}
.adm-pill.adm{background:rgba(184,130,30,.14);color:var(--r-warn)}
.adm-health{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.adm-h-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--r-pos);border-radius:3px;padding:10px 13px}
.adm-h-row.flag{border-left-color:var(--r-warn)}
.adm-h-row.bad{border-left-color:var(--r-neg)}
.adm-h-k{font-size:11.5px;color:var(--r-body);line-height:1.35}
.adm-h-v{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:600;color:var(--r-ink);flex-shrink:0}
.adm-h-row.flag .adm-h-v{color:var(--r-warn)}
.adm-h-row.bad  .adm-h-v{color:var(--r-neg)}
.adm-tip{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:var(--r-rule);color:var(--r-cap);font-size:8.5px;font-weight:700;margin-left:5px;cursor:help;position:relative;vertical-align:middle;font-style:normal;flex-shrink:0}
.adm-tip:hover,.adm-tip:focus{background:var(--gold);color:#fff;outline:none}
.adm-tip .tip-t{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);width:230px;background:#1A1C2A;color:#fff;font-size:11px;font-weight:400;line-height:1.5;padding:9px 11px;border-radius:3px;text-transform:none;letter-spacing:normal;opacity:0;pointer-events:none;transition:opacity .14s;z-index:400;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.24)}
.adm-tip .tip-t::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#1A1C2A}
.adm-tip:hover .tip-t,.adm-tip:focus .tip-t{opacity:1}
/* keep tooltips from being clipped by their cards */
.adm-tile,.adm-card,.adm-h-row,.adm-sec{overflow:visible}
/* flip to the left near the right edge of a grid row */
.adm-tiles > .adm-tile:last-child .tip-t,
.adm-health > .adm-h-row:last-child .tip-t{left:auto;right:-4px;transform:none}
.adm-tiles > .adm-tile:last-child .tip-t::after,
.adm-health > .adm-h-row:last-child .tip-t::after{left:auto;right:12px;transform:none}
.adm-empty{font-size:11.5px;color:var(--r-cap);font-style:italic;padding:12px 0}
@media(max-width:820px){ .adm-cols{grid-template-columns:1fr} .adm-bar-row{grid-template-columns:104px 1fr 40px} }
.adm-top{max-width:1080px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.adm-brand{display:flex;align-items:center;gap:9px}
.adm-coin{width:28px;height:28px;border:1.6px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);font-weight:600}
.adm-brandname{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--ink)}
.adm-btn{background:transparent;border:1px solid var(--rule);border-radius:3px;padding:8px 15px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--ink);cursor:pointer}
.adm-btn:hover{border-color:var(--gold)}
.results-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--r-cap);padding:60px 24px}
.results-placeholder .icon{font-size:2.6rem;margin-bottom:12px;opacity:.4}
.results-placeholder p{font-size:13.5px;line-height:1.6;max-width:340px}

/* ── Lanvivo report template (shared with the portal's PDFs) ── */
/* ── Property Report (printable PDF) ─────────────────────────────────────── */
.report-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 32px 0;flex-wrap:wrap;margin-bottom:8px}
.report-page{background:#fff;color:var(--ink,#1A1C2A);max-width:820px;margin:0 auto;padding:36px 44px 32px;box-shadow:0 4px 20px rgba(0,0,0,0.08);font-family:'DM Sans',sans-serif;line-height:1.4}
body.dark .report-page{box-shadow:0 4px 20px rgba(0,0,0,0.4)}
/* Header */
.report-header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;margin-bottom:22px;border-bottom:2px solid #1A2A5E;gap:20px}
.report-brand{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;color:#1A2A5E;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px}
.report-brand-mark{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:2px solid #B8821E;border-radius:50%;font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#B8821E;font-weight:700}
.report-meta{text-align:right;font-size:11px;color:#666;line-height:1.5}
.report-meta strong{color:var(--ink,#1A1C2A);font-size:12px}
/* Hero: property name + headline interpretation */
.report-hero{margin-bottom:24px}
.report-property-name{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:var(--ink,#1A1C2A);margin-bottom:4px;line-height:1.2}
.report-property-meta{font-size:11px;color:#666;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:14px}
.report-headline{background:linear-gradient(135deg,rgba(26,42,94,0.05),rgba(184,130,30,0.07));border-left:3px solid #B8821E;padding:14px 18px;font-size:14px;line-height:1.5;color:var(--ink,#1A1C2A);font-weight:500}
/* The Big Four */
.report-big4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 24px}
.r4-card{background:#FAF8F4;border:1px solid #E8E0CC;padding:14px 12px;border-radius:3px;text-align:center}
.r4-card .r4-label{font-size:9px;font-weight:500;letter-spacing:1.3px;text-transform:uppercase;color:#666;margin-bottom:6px}
.r4-card .r4-value{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;line-height:1;margin-bottom:4px}
.r4-card .r4-sub{font-size:9.5px;color:#888;letter-spacing:0.3px}
.r4-good{color:#2E7D52}
.r4-warn{color:#B8821E}
.r4-bad{color:#C62828}
.r4-neutral{color:var(--ink,#1A1C2A)}
/* Two-column layout: projection chart + cash-to-close */
.report-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
.report-card{background:#fff;border:1px solid #E0DBC8;padding:14px 16px;border-radius:3px}
.report-card h5{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#1A2A5E;margin-bottom:10px}
/* Projection mini-chart */
/* Cash-to-close bar */
/* Plain-English interpretation */
.report-interpretation{margin-bottom:22px}
.report-interpretation h5{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#1A2A5E;margin-bottom:10px}
.report-interp-body{font-size:12px;line-height:1.6;color:#444}
.report-interp-bullets{list-style:none;padding:0;margin-top:10px}
.report-interp-bullets li{font-size:11.5px;line-height:1.55;color:#444;padding-left:16px;position:relative;margin-bottom:6px}
.report-interp-bullets li::before{content:'→';position:absolute;left:0;color:#B8821E;font-weight:700}
.report-interp-bullets li strong{color:var(--ink,#1A1C2A)}
/* DSCR row */
/* Footer */
.report-footer{padding-top:14px;border-top:1px solid #ddd;font-size:9.5px;color:#888;line-height:1.5}
.report-footer p{margin-bottom:5px}
/* Print stylesheet, hide portal chrome, render report at letter size */

@media print {
  @page { size: letter; margin: 0.4in; }
  body, body.dark { background:#fff !important; color:#1A1C2A !important; }
  .no-print, .adm-top, #gate { display:none !important; }
  .shell { padding:0 !important; }
  #adm-body, .adm-head { display:none !important; }
  #adm-report { display:block !important; }
  .report-page { box-shadow:none !important; max-width:100% !important; padding:0 !important; margin:0 !important; }
  .report-hero, .report-big4, .report-section, .report-interpretation { page-break-inside:avoid; }
  .report-table thead { display:table-header-group; }
  .report-table tr { page-break-inside:avoid; }
  * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
}
.report-section{margin-bottom:20px}
.report-section > h5{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#1A2A5E;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #E8E0CC}
.report-kv{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.report-kv tr td{padding:6px 10px;border-bottom:1px solid #EFEBE0;vertical-align:top}
.report-kv tr:nth-child(even) td{background:#FCFBF8}
.report-kv td:first-child{color:#666;width:62%}
.report-kv td:last-child{color:#1A1C2A;font-weight:600;text-align:right;width:38%;font-variant-numeric:tabular-nums}
.report-table{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed}
.report-table thead th{background:#FAF8F4;border-bottom:1.5px solid #1A2A5E;font-size:8.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:#1A2A5E;text-align:left;padding:7px 8px}
.report-table tbody td{border-bottom:1px solid #EFEBE0;padding:6px 8px;color:#444;vertical-align:middle;word-break:break-word}
.report-table tbody tr:nth-child(even) td{background:#FCFBF8}
.report-table tbody td:first-child{color:#1A1C2A;font-weight:500}
.report-table td.num,.report-table th.num{text-align:right;font-variant-numeric:tabular-nums}
/* users table: fixed widths so dates stop wrapping onto two lines */
.report-users col.c-name{width:21%}
.report-users col.c-mail{width:33%}
.report-users col.c-join{width:13%}
.report-users col.c-seen{width:13%}
.report-users col.c-prop{width:8%}
.report-users col.c-stat{width:12%}
.report-pull{background:#FAF8F4;border:1px solid #E8E0CC;border-left:3px solid #B8821E;padding:10px 15px;border-radius:3px;margin-top:10px;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;color:#B8821E}
.report-note{background:#FAF8F4;border-left:3px solid #B8821E;padding:10px 15px;border-radius:3px;margin-top:10px;font-size:11px;line-height:1.55;color:#444}
.report-note strong{color:#1A1C2A}
.report-sub-h{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#6B6C7E;margin:12px 0 5px}
#adm-report{display:none}
#adm-report.on{display:block}

</style>
</head>
<body>

<!-- auth gate -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-mark"><div class="gate-coin">L</div><div class="gate-word">Analytics</div></div>
    <div class="gate-card">
      <h1>Sign in</h1>
      <p>Restricted access.</p>
      <div class="gate-err" id="gate-err"></div>
      <div class="gate-f"><label>Email</label>
        <input type="email" id="g-email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('g-pw').focus()"></div>
      <div class="gate-f"><label>Password</label>
        <input type="password" id="g-pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')gateSignIn()"></div>
      <button class="gate-btn" id="g-btn" onclick="gateSignIn()">Sign in</button>
      <div class="gate-div"><span>or</span></div>
      <button class="gate-google" id="g-goog" onclick="gateGoogle()">
        <svg width="17" height="17" viewBox="0 0 24 24" style="margin-right:8px;vertical-align:middle"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>
</div>

<!-- dashboard -->
<div class="shell" id="shell">
  <div class="adm-top">
    <div class="adm-brand"><div class="adm-coin">L</div><div class="adm-brandname">Analytics</div></div>
    <div style="display:flex;gap:8px">
      <button class="adm-btn" onclick="toggleTheme()" id="theme-btn">Dark</button>
      <button class="adm-btn" onclick="loadAdmin(true)">Refresh</button>
      <button class="adm-btn" onclick="exportAdminPdf()" id="pdf-btn">Export PDF</button>
      <button class="adm-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="adm-wrap">
    <div class="adm-head">
      <div>
        <h2>Portal Analytics</h2>
        <p id="adm-generated">&nbsp;</p>
      </div>
    </div>
    <div id="adm-body"></div>
    <div id="adm-report"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fumqbfxvtusnslkvacdz.supabase.co';

/* ── theme ── */
function toggleTheme(){
  const d = document.body.classList.toggle('dark');
  document.getElementById('theme-btn').textContent = d ? 'Light' : 'Dark';
  try { localStorage.setItem('lv_admin_theme', d ? 'dark' : 'light'); } catch(e){}
}
(function(){
  let t=null; try { t = localStorage.getItem('lv_admin_theme'); } catch(e){}
  if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.body.classList.add('dark');
  }
})();

/* ── auth ── */
function gateErr(m){ const e=document.getElementById('gate-err'); e.textContent=m; e.style.display='block'; }

async function gateSignIn(){
  const btn=document.getElementById('g-btn');
  const email=document.getElementById('g-email').value.trim();
  const pw=document.getElementById('g-pw').value;
  document.getElementById('gate-err').style.display='none';
  if(!email||!pw){ gateErr('Enter your email and password.'); return; }
  btn.disabled=true; btn.textContent='Signing in...';
  try{
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    await enter();
  }catch(err){
    gateErr(err.message || 'Sign in failed.');
  }finally{
    btn.disabled=false; btn.textContent='Sign in';
  }
}

// Google OAuth. redirectTo must be in Supabase -> Authentication -> URL Configuration
// -> Redirect URLs, otherwise Supabase refuses the callback.
async function gateGoogle(){
  const btn=document.getElementById('g-goog');
  document.getElementById('gate-err').style.display='none';
  btn.disabled=true; btn.textContent='Redirecting...';
  try{
    const { error } = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{ redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) throw error;
    // success -> browser navigates to Google, then back here
  }catch(err){
    gateErr(err.message || 'Google sign-in failed.');
    btn.disabled=false; btn.textContent='Continue with Google';
  }
}

async function signOut(){
  await sb.auth.signOut();
  _cache=null; _cacheAt=0;
  document.getElementById('shell').classList.remove('on');
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('g-pw').value='';
}

// Verified server-side: admin_overview() raises 42501 for non-admins, so this
// check is for UX only. The real boundary is in Postgres.
async function enter(){
  document.getElementById('gate').classList.add('hide');
  document.getElementById('shell').classList.add('on');
  document.getElementById('theme-btn').textContent =
    document.body.classList.contains('dark') ? 'Light' : 'Dark';

}

function _admEsc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function _admNum(n)  { return (n == null ? 0 : Number(n)).toLocaleString(); }
function _admDate(d) { return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }

function _admTip(text) {
  if (!text) return '';
  return '<i class="adm-tip" tabindex="0">i<span class="tip-t">' + _admEsc(text) + '</span></i>';
}

function _admTile(k, v, sub, tone, tip) {
  return '<div class="adm-tile ' + (tone||'') + '"><div class="adm-tile-k">' + _admEsc(k) + _admTip(tip) + '</div>' +
         '<div class="adm-tile-v">' + _admEsc(v) + '</div>' +
         (sub ? '<div class="adm-tile-s">' + _admEsc(sub) + '</div>' : '') + '</div>';
}

function _admSecH(label, tip) {
  return '<div class="adm-sec-h">' + _admEsc(label) + _admTip(tip) + '</div>';
}

function _admBars(rows, emptyMsg) {
  if (!rows || !rows.length) return '<div class="adm-empty">' + _admEsc(emptyMsg || 'No data yet.') + '</div>';
  const max = Math.max.apply(null, rows.map(r => Number(r.n) || 0)) || 1;
  return rows.map(r => {
    const pct = ((Number(r.n)||0) / max * 100).toFixed(1);
    return '<div class="adm-bar-row"><div class="adm-bar-lbl" title="' + _admEsc(r.k) + '">' + _admEsc(r.k) + '</div>' +
           '<div class="adm-bar-track"><div class="adm-bar-fill" style="width:' + pct + '%"></div></div>' +
           '<div class="adm-bar-n">' + _admNum(r.n) + '</div></div>';
  }).join('');
}

// Fills gaps so the sparkline reflects real calendar time, not just days with rows.
function _admSpark(series, days) {
  days = days || 30;
  if (!series || !series.length) return '<div class="adm-empty">No activity recorded yet.</div>';
  const byDay = {};
  series.forEach(r => { byDay[r.d] = Number(r.n) || 0; });
  const out = [], today = new Date();
  for (let i = days - 1; i >= 0; i--) {
    const dt = new Date(today); dt.setDate(today.getDate() - i);
    const key = dt.toISOString().slice(0,10);
    out.push({ d: key, n: byDay[key] || 0 });
  }
  const max = Math.max.apply(null, out.map(o => o.n)) || 1;
  const bars = out.map(o => {
    const h = o.n === 0 ? 2 : Math.max(4, (o.n / max) * 100);
    return '<div class="adm-spark-b" style="height:' + h + '%' + (o.n === 0 ? ';opacity:.18' : '') +
           '" title="' + o.d + ': ' + o.n + '"></div>';
  }).join('');
  return '<div class="adm-spark">' + bars + '</div>' +
         '<div class="adm-spark-x"><span>' + _admDate(out[0].d) + '</span><span>' + _admDate(out[out.length-1].d) + '</span></div>';
}


async function loadAdmin(force){
  const body=document.getElementById('adm-body');
  if(!body) return;

  const fresh = _cache && (Date.now() - _cacheAt) < CACHE_TTL_MS;
  if (fresh && !force) { renderAdminDashboard(_cache.o, _cache.u); return; }

  body.innerHTML='<div class="results-placeholder">'+
    '<div style="width:24px;height:24px;border:2px solid var(--rule);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px"></div>'+
    '<p>Loading analytics...</p></div>';

  try{
    const [ov,us] = await Promise.all([ sb.rpc('admin_overview'), sb.rpc('admin_users') ]);
    if (ov.error) throw ov.error;
    if (us.error) throw us.error;
    _cache={o:ov.data,u:us.data||[]}; _cacheAt=Date.now();
    renderAdminDashboard(ov.data, us.data||[]);
  }catch(err){
    const denied = err && (err.code==='42501' || /not authorized/i.test(err.message||''));
    body.innerHTML='<div class="results-placeholder"><div class="icon">'+(denied?'&#128274;':'&#9888;&#65039;')+'</div><p>'+
      (denied ? 'This account does not have admin access.'
              : 'Could not load analytics: '+_admEsc(err.message||String(err)))+'</p></div>';
    if (denied) {
      const g=document.getElementById('adm-generated');
      if(g) g.textContent='Access denied';
    }
  }
}

function renderAdminDashboard(o, users) {
  const body = document.getElementById('adm-body');
  if (!body || !o) return;
  const t = o.totals || {}, a = o.active || {}, h = o.health || {};

  const gen = document.getElementById('adm-generated');
  if (gen) gen.textContent = 'Live from Supabase · updated ' +
    new Date(o.generated_at || Date.now()).toLocaleString('en-US',
      { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

  // CTA funnel: impressions -> clicks -> bookings
  const byType = {};
  (o.events_by_type || []).forEach(r => { byType[r.k] = Number(r.n) || 0; });
  const imp = byType.impression || 0, clk = byType.click || 0, bkg = byType.booking_opened || 0;
  const ctr = imp ? (clk / imp * 100) : 0;

  const activationPct = t.users ? ((t.users - (h.users_no_properties || 0)) / t.users * 100) : 0;

  const healthRow = (label, val, tone, tip) =>
    '<div class="adm-h-row ' + (tone||'') + '"><div class="adm-h-k">' + _admEsc(label) + _admTip(tip) +
    '</div><div class="adm-h-v">' + _admNum(val) + '</div></div>';

  const userRows = (users || []).slice(0, 25).map(u =>
    '<tr>' +
    '<td>' + _admEsc(u.name || '—') + (u.is_admin ? ' <span class="adm-pill adm">admin</span>' : '') + '</td>' +
    '<td>' + _admEsc(u.email) + '</td>' +
    '<td>' + _admDate(u.created_at) + '</td>' +
    '<td>' + (u.last_sign_in_at ? _admDate(u.last_sign_in_at) : '<span style="color:var(--r-cap)">never</span>') + '</td>' +
    '<td>' + _admNum(u.property_count) + '</td>' +
    '<td><span class="adm-pill ' + (u.email_confirmed ? 'ok' : 'no') + '">' +
        (u.email_confirmed ? 'confirmed' : 'pending') + '</span></td>' +
    '</tr>').join('');

  body.innerHTML =
    // ── headline tiles ──
    '<div class="adm-sec">' + _admSecH('Overview','Totals across the whole project, not filtered by date unless the tile says otherwise.') + '<div class="adm-tiles">' +
      _admTile('Total users', _admNum(t.users), _admNum(a.signups_30d) + ' in last 30d', '',
               'Every row in auth.users — including accounts that never confirmed their email or never signed in. Not a measure of real usage.') +
      _admTile('Active (30d)', _admNum(a.users_30d), _admNum(a.users_7d) + ' in last 7d',
               (a.users_30d||0) > 0 ? 'pos' : 'warn',
               'Users whose last sign-in falls inside the last 30 days. Someone who signed up and never came back is not counted here.') +
      _admTile('Properties saved', _admNum(t.properties), _admNum(t.purchased) + ' marked purchased', '',
               'Rows in saved_properties across all users, including deals later marked as purchased. One user can save many.') +
      _admTile('Activation', activationPct.toFixed(0) + '%', 'saved ≥ 1 property',
               activationPct >= 50 ? 'pos' : activationPct >= 25 ? 'warn' : 'neg',
               'Share of users who saved at least one property. Saving a deal is the core action of the portal — a signup who never saves has not really activated.') +
      _admTile('CTA events', _admNum(t.events), _admNum(a.events_7d) + ' in last 7d', '',
               'Rows in specialist_cta_events: impressions, clicks and booking-opens fired by the partner CTA components.') +
      _admTile('Click-through', ctr.toFixed(1) + '%', _admNum(clk) + ' of ' + _admNum(imp) + ' impressions',
               ctr >= 10 ? 'pos' : ctr >= 3 ? 'warn' : 'neg',
               'Clicks divided by impressions on the specialist CTA. Under about 3% usually means the CTA is being ignored or shown in the wrong place.') +
    '</div></div>' +

    // ── signups + events over time ──
    '<div class="adm-sec"><div class="adm-cols">' +
      '<div class="adm-card">' + _admSecH('Signups · last 30 days','One bar per calendar day from auth.users. Days with no signups render as faint stubs, so a gap is genuinely empty rather than skipped.') + _admSpark(o.signups_by_day, 30) + '</div>' +
      '<div class="adm-card">' + _admSecH('CTA events · last 30 days','All specialist_cta_events by day. Spikes usually mean one user browsing a lot, not many users — cross-check against Active (30d).') + _admSpark(o.events_by_day, 30) + '</div>' +
    '</div></div>' +

    // ── funnel + placement ──
    '<div class="adm-sec"><div class="adm-cols">' +
      '<div class="adm-card">' + _admSecH('Specialist CTA funnel','Impression → click → booking opened. If clicks and booking-opens are identical, the two events are probably firing together rather than measuring separate steps.') +
        _admBars([
          { k:'Impressions',    n: imp },
          { k:'Clicks',         n: clk },
          { k:'Booking opened', n: bkg }
        ], 'No CTA events recorded yet.') +
        (imp ? '<div class="adm-tile-s" style="margin-top:8px">' + ctr.toFixed(1) +
               '% of impressions convert to a click' +
               (clk ? ' · ' + (bkg/clk*100).toFixed(0) + '% of clicks open booking' : '') + '</div>' : '') +
      '</div>' +
      '<div class="adm-card">' + _admSecH('Events by placement','Which surface the CTA rendered on. A heavy skew means the other placements are under-exposed, which is different from under-performing.') +
        _admBars(o.events_by_placement, 'No placements recorded yet.') + '</div>' +
    '</div></div>' +

    // ── audience ──
    '<div class="adm-sec"><div class="adm-cols">' +
      '<div class="adm-card">' + _admSecH('Primary language','From profiles.primary_language, set by the portal language switcher. (unset) means the user never changed it from the default.') + _admBars(o.languages) + '</div>' +
      '<div class="adm-card">' + _admSecH('Visa status','From profiles.visa_status. The signup flow does not currently collect this, so expect it to be unset for everyone until that changes.') + _admBars(o.visa) + '</div>' +
    '</div></div>' +

    // ── leads + waitlist ──
    '<div class="adm-sec">' + _admSecH('Leads & waitlist','Capture tables. Each fills only when a visitor completes the matching form, so zeros here mean no submissions rather than a broken pipeline.') + '<div class="adm-tiles">' +
      _admTile('Partner leads', _admNum(t.leads), '', '', 'partner_leads — submitted through the lender, agent and CPA CTAs inside the portal.') +
      _admTile('GPT waitlist', _admNum(t.waitlist), '', '', 'gpt_waitlist — emails collected on the Lanvivo GPT coming-soon page.') +
      _admTile('Management leads', _admNum(t.mgmt_leads), '', '', 'management_leads — property-management enquiries raised against a specific saved property.') +
      _admTile('Survey responses', _admNum(t.surveys), '', '', 'survey_responses — answers from any in-portal survey.') +
      _admTile('Partner applications', _admNum(t.partner_apps), '', '', 'partner_applications — lenders, agents and CPAs applying to join the network.') +
      _admTile('Performance logs', _admNum(t.perf_logs), '', '', 'property_performance_logs — year-by-year actuals users enter to compare against their original projection.') +
    '</div>' +
    ((t.leads||0)+(t.waitlist||0)+(t.mgmt_leads||0)+(t.surveys||0)+(t.partner_apps||0) === 0
      ? '<div class="adm-empty">No leads captured yet — these fill in as visitors use the partner CTAs and waitlist forms.</div>' : '') +
    '</div>' +

    // ── data health ──
    '<div class="adm-sec">' + _admSecH('Data health','Integrity checks. Green means nothing to do; amber is worth watching; red means rows are genuinely inconsistent.') + '<div class="adm-health">' +
      healthRow('Users missing a profile row', h.users_without_profile, (h.users_without_profile||0) > 0 ? 'bad' : '',
        'auth.users rows with no matching profiles row. Should stay at zero — a database trigger now creates a profile on every signup, including Google OAuth.') +
      healthRow('Email not yet confirmed',     h.unconfirmed_email,     (h.unconfirmed_email||0) > 0 ? 'flag' : '',
        'Signed up but never clicked the confirmation link. They cannot sign in with a password until they do.') +
      healthRow('Never signed in',             h.never_signed_in,       (h.never_signed_in||0) > 0 ? 'flag' : '',
        'Account exists but last_sign_in_at is null. Usually an abandoned signup or a confirmation email that never got opened.') +
      healthRow('Signed up, saved nothing',    h.users_no_properties,   (h.users_no_properties||0) > 0 ? 'flag' : '',
        'The inverse of Activation. These users reached the portal but never saved a deal — the clearest drop-off signal you have.') +
      healthRow('Orphaned properties',         h.orphan_properties,     (h.orphan_properties||0) > 0 ? 'bad' : '',
        'saved_properties rows whose user_id points at a deleted account. Non-zero means a delete did not cascade properly.') +
      healthRow('Events with no user',         h.events_no_user,        (h.events_no_user||0) > 0 ? 'flag' : '',
        'CTA events recorded with a null user_id — fired before sign-in or by a signed-out visitor.') +
    '</div></div>' +

    // ── users ──
    '<div class="adm-sec">' + _admSecH('Users · ' + _admNum((users||[]).length) +
      ((users||[]).length > 25 ? ' (showing 25 most recent)' : ''),
      'Joined from auth.users and profiles, newest first. Props counts saved properties. Status shows whether the email was ever confirmed.') +
      '<div class="adm-card" style="padding:6px 10px 2px">' +
      '<table class="adm-table"><thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last seen</th><th>Props</th><th>Status</th></tr></thead>' +
      '<tbody>' + (userRows || '<tr><td colspan="6" class="adm-empty">No users yet.</td></tr>') + '</tbody></table></div></div>';
}



/* ── PDF export: renders the metrics into the same .report-page template the
   Cash Flow and Property Analysis PDFs use, then hands off to the print dialog. ── */

function exportAdminPdf() {
  if (!_cache || !_cache.o) { alert('Load the dashboard first.'); return; }
  document.getElementById('adm-report').innerHTML = renderAdminReportHTML(_cache.o, _cache.u || []);
  document.getElementById('adm-report').classList.add('on');
  document.getElementById('adm-body').style.display = 'none';
  // let layout settle before the print dialog captures it
  setTimeout(function(){
    window.print();
    document.getElementById('adm-report').classList.remove('on');
    document.getElementById('adm-body').style.display = '';
  }, 120);
}

// "29 Aug 26" — fits a narrow column without wrapping, unlike "Aug 29, 2026"
function _admDateShort(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.getDate() + ' ' +
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()] +
    " '" + String(dt.getFullYear()).slice(2);
}

function renderAdminReportHTML(o, users) {
  var t = o.totals || {}, a = o.active || {}, h = o.health || {};
  var today = new Date(o.generated_at || Date.now())
    .toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  var byType = {};
  (o.events_by_type || []).forEach(function(r){ byType[r.k] = Number(r.n) || 0; });
  var imp = byType.impression || 0, clk = byType.click || 0, bkg = byType.booking_opened || 0;
  var ctr = imp ? (clk / imp * 100) : 0;
  var activation = t.users ? ((t.users - (h.users_no_properties || 0)) / t.users * 100) : 0;

  var cls = function(v, good, ok){ return v >= good ? 'r4-good' : v >= ok ? 'r4-warn' : 'r4-bad'; };

  // headline reads the data rather than restating it
  var headline, sub;
  if (activation >= 50) {
    headline = 'Most signups are reaching the core action.';
    sub = activation.toFixed(0) + '% of users have saved at least one property.';
  } else if (activation >= 25) {
    headline = 'Signups are arriving, but most never save a deal.';
    sub = 'Only ' + activation.toFixed(0) + '% of users have saved a property — ' +
          _admNum(h.users_no_properties) + ' of ' + _admNum(t.users) +
          ' signed up and left without running one.';
  } else {
    headline = 'Activation is the bottleneck, not acquisition.';
    sub = 'Just ' + activation.toFixed(0) + '% of users have saved a property. ' +
          _admNum(h.users_no_properties) + ' of ' + _admNum(t.users) +
          ' signed up without ever running a deal.';
  }

  var row = function(k, v){ return '<tr><td>' + _admEsc(k) + '</td><td>' + _admEsc(v) + '</td></tr>'; };
  var kv = function(rows){ return '<table class="report-kv"><tbody>' + rows.join('') + '</tbody></table>'; };
  var barTable = function(list, empty){
    if (!list || !list.length) return '<div class="report-note">' + _admEsc(empty) + '</div>';
    var total = list.reduce(function(s,r){ return s + (Number(r.n)||0); }, 0) || 1;
    return '<table class="report-table">' +
      '<colgroup><col style="width:56%"><col style="width:22%"><col style="width:22%"></colgroup>' +
      '<thead><tr><th>Item</th><th class="num">Count</th><th class="num">Share</th></tr></thead><tbody>' +
      list.map(function(r){
        return '<tr><td>' + _admEsc(r.k) + '</td><td class="num">' + _admNum(r.n) + '</td><td class="num">' +
               ((Number(r.n)||0)/total*100).toFixed(1) + '%</td></tr>';
      }).join('') + '</tbody></table>';
  };

  var userRows = (users || []).slice(0, 20).map(function(u){
    return '<tr><td>' + _admEsc(u.name || '—') + (u.is_admin ? ' <strong>(admin)</strong>' : '') + '</td>' +
      '<td>' + _admEsc(u.email) + '</td>' +
      '<td>' + _admDateShort(u.created_at) + '</td>' +
      '<td>' + (u.last_sign_in_at ? _admDateShort(u.last_sign_in_at) : 'never') + '</td>' +
      '<td class="num">' + _admNum(u.property_count) + '</td>' +
      '<td>' + (u.email_confirmed ? 'confirmed' : 'pending') + '</td></tr>';
  }).join('');

  // n===1 needs singular noun AND singular verb, e.g. "1 account has never signed in"
  var plur = function(n, one, many){ return _admNum(n) + ' ' + (Number(n) === 1 ? one : many); };
  var flagged = [];
  if ((h.users_without_profile||0) > 0) flagged.push(plur(h.users_without_profile, 'user has no profile row', 'users have no profile row'));
  if ((h.orphan_properties||0)  > 0) flagged.push(plur(h.orphan_properties, 'property is orphaned', 'properties are orphaned'));
  if ((h.never_signed_in||0)    > 0) flagged.push(plur(h.never_signed_in, 'account has never signed in', 'accounts have never signed in'));
  if ((h.unconfirmed_email||0)  > 0) flagged.push(plur(h.unconfirmed_email, 'email is unconfirmed', 'emails are unconfirmed'));

  return '' +
  '<div class="report-page">' +
    '<div class="report-header">' +
      '<div class="report-brand"><span class="report-brand-mark">L</span>Lanvivo</div>' +
      '<div class="report-meta"><div><strong>Portal Analytics Report</strong></div><div>Generated ' + _admEsc(today) + '</div></div>' +
    '</div>' +

    '<div class="report-hero">' +
      '<div class="report-property-name">Portal Analytics</div>' +
      '<div class="report-property-meta">' + _admNum(t.users) + ' users · ' + _admNum(t.properties) +
        ' properties · ' + _admNum(t.events) + ' CTA events</div>' +
      '<div class="report-headline">' + _admEsc(headline) + ' ' + _admEsc(sub) + '</div>' +
    '</div>' +

    '<div class="report-big4">' +
      '<div class="r4-card"><div class="r4-label">Total Users</div><div class="r4-value r4-neutral">' + _admNum(t.users) +
        '</div><div class="r4-sub">' + _admNum(a.signups_30d) + ' in last 30d</div></div>' +
      '<div class="r4-card"><div class="r4-label">Activation</div><div class="r4-value ' + cls(activation,50,25) + '">' +
        activation.toFixed(0) + '%</div><div class="r4-sub">saved &ge; 1 property</div></div>' +
      '<div class="r4-card"><div class="r4-label">Active (30d)</div><div class="r4-value ' + cls(a.users_30d||0,5,1) + '">' +
        _admNum(a.users_30d) + '</div><div class="r4-sub">signed in last 30d</div></div>' +
      '<div class="r4-card"><div class="r4-label">CTA Click-through</div><div class="r4-value ' + cls(ctr,10,3) + '">' +
        ctr.toFixed(1) + '%</div><div class="r4-sub">' + _admNum(clk) + ' of ' + _admNum(imp) + ' impressions</div></div>' +
    '</div>' +

    '<div class="report-section"><h5>Totals</h5>' + kv([
      row('Registered users', _admNum(t.users)),
      row('Profiles', _admNum(t.profiles)),
      row('Saved properties', _admNum(t.properties)),
      row('Marked purchased', _admNum(t.purchased)),
      row('CTA events', _admNum(t.events)),
      row('Performance logs', _admNum(t.perf_logs))
    ]) + '</div>' +

    '<div class="report-section"><h5>Recent Activity</h5>' + kv([
      row('Signups, last 7 days', _admNum(a.signups_7d)),
      row('Signups, last 30 days', _admNum(a.signups_30d)),
      row('Active users, last 7 days', _admNum(a.users_7d)),
      row('Active users, last 30 days', _admNum(a.users_30d)),
      row('CTA events, last 7 days', _admNum(a.events_7d))
    ]) + '</div>' +

    '<div class="report-section"><h5>Specialist CTA Funnel</h5>' +
      kv([ row('Impressions', _admNum(imp)), row('Clicks', _admNum(clk)),
           row('Booking opened', _admNum(bkg)), row('Click-through rate', ctr.toFixed(1) + '%') ]) +
      (imp ? '<div class="report-pull">' + ctr.toFixed(1) + '% of impressions convert to a click</div>' : '') +
      (clk && clk === bkg ? '<div class="report-note"><strong>Worth checking:</strong> clicks and booking-opens are ' +
        'identical (' + _admNum(clk) + ' each). These two events may be firing together rather than measuring ' +
        'separate steps of the funnel.</div>' : '') +
    '</div>' +

    '<div class="report-section"><h5>Events by Placement</h5>' +
      barTable(o.events_by_placement, 'No placement data recorded yet.') + '</div>' +

    '<div class="report-section"><h5>Audience</h5>' +
      '<div class="report-sub-h">Primary language</div>' +
      barTable(o.languages, 'No language data.') +
      '<div class="report-sub-h">Visa status</div>' +
      barTable(o.visa, 'No visa data.') + '</div>' +

    '<div class="report-section"><h5>Leads &amp; Waitlist</h5>' + kv([
      row('Partner leads', _admNum(t.leads)),
      row('GPT waitlist', _admNum(t.waitlist)),
      row('Management leads', _admNum(t.mgmt_leads)),
      row('Survey responses', _admNum(t.surveys)),
      row('Partner applications', _admNum(t.partner_apps))
    ]) +
    (((t.leads||0)+(t.waitlist||0)+(t.mgmt_leads||0)+(t.surveys||0)+(t.partner_apps||0)) === 0
      ? '<div class="report-note">No leads captured yet. These tables fill as visitors complete the partner CTAs and waitlist forms.</div>' : '') +
    '</div>' +

    '<div class="report-section"><h5>Data Health</h5>' + kv([
      row('Users missing a profile row', _admNum(h.users_without_profile)),
      row('Email not yet confirmed', _admNum(h.unconfirmed_email)),
      row('Never signed in', _admNum(h.never_signed_in)),
      row('Signed up, saved nothing', _admNum(h.users_no_properties)),
      row('Orphaned properties', _admNum(h.orphan_properties)),
      row('Events with no user', _admNum(h.events_no_user))
    ]) +
    (flagged.length ? '<div class="report-note"><strong>Needs attention:</strong> ' + _admEsc(flagged.join('; ')) + '.</div>'
                    : '<div class="report-note">No integrity problems detected.</div>') +
    '</div>' +

    '<div class="report-interpretation"><h5>What This Means</h5>' +
      '<div class="report-interp-body">' + _admEsc(sub) + ' Of ' + _admNum(t.events) +
        ' CTA events recorded, ' + _admNum(imp) + ' were impressions and ' + _admNum(clk) +
        ' were clicks, a ' + ctr.toFixed(1) + '% click-through rate.</div>' +
      '<ul class="report-interp-bullets">' +
        '<li><strong>Acquisition.</strong> ' + _admNum(t.users) + ' registered users, ' +
          _admNum(a.signups_30d) + ' in the last 30 days.</li>' +
        '<li><strong>Activation.</strong> ' + activation.toFixed(0) + '% have saved a property; ' +
          _admNum(h.users_no_properties) + ' never have.</li>' +
        '<li><strong>Engagement.</strong> ' + _admNum(a.users_30d) + ' users signed in during the last 30 days.</li>' +
      '</ul></div>' +

    '<div class="report-section"><h5>Users' +
      ((users||[]).length > 20 ? ' &middot; 20 most recent of ' + _admNum(users.length) : '') + '</h5>' +
      '<table class="report-table report-users">' +
      '<colgroup><col class="c-name"><col class="c-mail"><col class="c-join"><col class="c-seen"><col class="c-prop"><col class="c-stat"></colgroup>' +
      '<thead><tr><th>Name</th><th>Email</th><th>Joined</th><th>Last seen</th><th class="num">Props</th><th>Status</th></tr></thead><tbody>' +
      (userRows || '<tr><td colspan="6">No users yet.</td></tr>') + '</tbody></table></div>' +

    '<div class="report-footer">' +
      '<p><strong>Internal use only.</strong> Figures are read live from the Lanvivo Supabase project at the moment of generation ' +
      'and will change as users interact with the portal. This report contains personal data — handle accordingly.</p>' +
      '<p>Generated by Lanvivo &middot; lanvivo.com &middot; ' + _admEsc(today) + '</p>' +
    '</div>' +
  '</div>';
}

/* ── boot: restore an existing session, else show the gate ── */
(async function(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (session) { await enter(); }
  }catch(e){ /* fall through to the gate */ }
})();
</script>
</body>
</html>
